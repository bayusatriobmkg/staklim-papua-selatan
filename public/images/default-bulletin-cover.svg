<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 595 842" width="595" height="842" style="background:#ffffff; font-family:'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00182b"/>
      <stop offset="45%" stop-color="#002b49"/>
      <stop offset="85%" stop-color="#034d7d"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="595" height="842" fill="url(#bgGrad)"/>

  <!-- Atmospheric Isobars / Topography Curves (Decorative) -->
  <path d="M-50 240 Q 150 160 300 250 T 650 220" fill="none" stroke="rgba(56, 189, 248, 0.18)" stroke-width="2.5" />
  <path d="M-50 290 Q 200 200 350 310 T 650 270" fill="none" stroke="rgba(56, 189, 248, 0.14)" stroke-width="2" />
  <path d="M-50 340 Q 180 250 400 360 T 650 320" fill="none" stroke="rgba(56, 189, 248, 0.10)" stroke-width="1.8" />
  <path d="M-50 390 Q 220 300 450 420 T 650 370" fill="none" stroke="rgba(56, 189, 248, 0.08)" stroke-width="1.5" />

  <!-- Abstract Rainfall Bar Chart Graphic in Background -->
  <g opacity="0.12" transform="translate(40, 520)">
    <rect x="0" y="80" width="28" height="120" rx="4" fill="#38bdf8"/>
    <rect x="38" y="40" width="28" height="160" rx="4" fill="#38bdf8"/>
    <rect x="76" y="20" width="28" height="180" rx="4" fill="#38bdf8"/>
    <rect x="114" y="60" width="28" height="140" rx="4" fill="#38bdf8"/>
    <rect x="152" y="30" width="28" height="170" rx="4" fill="#38bdf8"/>
    <rect x="190" y="90" width="28" height="110" rx="4" fill="#38bdf8"/>
    <rect x="228" y="110" width="28" height="90" rx="4" fill="#38bdf8"/>
    <rect x="266" y="70" width="28" height="130" rx="4" fill="#38bdf8"/>
  </g>

  <!-- Top Institutional Bar -->
  <rect x="0" y="0" width="595" height="10" fill="url(#goldGrad)"/>
  
  <g transform="translate(48, 52)">
    <!-- BMKG Circular Seal Logo Mockup -->
    <circle cx="28" cy="28" r="26" fill="#0284c7" stroke="#ffffff" stroke-width="2.5"/>
    <path d="M12 28 Q 28 14 44 28" fill="none" stroke="#ffffff" stroke-width="3"/>
    <path d="M16 35 Q 28 24 40 35" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
    <path d="M14 42 Q 28 32 42 42" fill="none" stroke="#22c55e" stroke-width="2.5"/>
    
    <text x="70" y="22" font-size="11.5" font-weight="800" fill="#38bdf8" letter-spacing="1.5">BADAN METEOROLOGI, KLIMATOLOGI, DAN GEOFISIKA</text>
    <text x="70" y="40" font-size="15" font-weight="900" fill="#ffffff" letter-spacing="0.5">STASIUN KLIMATOLOGI PAPUA SELATAN</text>
  </g>

  <!-- Main Center Card with Glassmorphism Effect -->
  <g transform="translate(48, 175)">
    <!-- White Glow Header Ribbon -->
    <rect x="0" y="0" width="180" height="28" rx="6" fill="#0284c7" />
    <text x="12" y="19" font-size="11" font-weight="800" fill="#ffffff" letter-spacing="1.5">PUBLIKASI RESMI</text>
    
    <!-- Big Title -->
    <text x="0" y="85" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="-1">BULETIN</text>
    <text x="0" y="132" font-size="44" font-weight="900" fill="#38bdf8" letter-spacing="-1">INFORMASI IKLIM</text>
    <text x="0" y="172" font-size="22" font-weight="800" fill="#e2e8f0" letter-spacing="1">PROVINSI PAPUA SELATAN</text>

    <!-- Thin Divider -->
    <rect x="0" y="198" width="499" height="3" fill="url(#accentGrad)"/>
    
    <!-- Edition & Volume Tag -->
    <g transform="translate(0, 222)">
      <rect x="0" y="0" width="220" height="36" rx="8" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>
      <circle cx="18" cy="18" r="5" fill="#f59e0b"/>
      <text x="32" y="23" font-size="13" font-weight="800" fill="#ffffff">EDISI NOVEMBER 2026</text>
    </g>

    <!-- Key Topics / Content Table Box -->
    <g transform="translate(0, 280)">
      <rect x="0" y="0" width="499" height="195" rx="12" fill="rgba(0, 25, 43, 0.65)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1.5" />
      
      <text x="24" y="36" font-size="14" font-weight="800" fill="#38bdf8">DAFTAR KONTEN UTAMA:</text>
      
      <g transform="translate(24, 60)" font-size="12" fill="#f1f5f9" font-weight="600">
        <text x="0" y="0">✦  Evaluasi Dinamika Atmosfer &amp; Laut (ENSO, IOD, MJO)</text>
        <text x="0" y="28">✦  Analisis Curah Hujan &amp; Sifat Hujan Bulan Oktober 2026</text>
        <text x="0" y="56">✦  Monitoring Hari Tanpa Hujan (HTH) &amp; Peringatan Kekeringan</text>
        <text x="0" y="84">✦  Prakiraan Curah Hujan &amp; Musim Hujan 3 Bulan ke Depan</text>
        <text x="0" y="112">✦  Informasi Agroklimat &amp; Neraca Air Sentra Pertanian Merauke</text>
      </g>
    </g>
  </g>

  <!-- Bottom Region & ISSN / Publication Seal -->
  <g transform="translate(48, 735)">
    <rect x="0" y="0" width="499" height="1" fill="rgba(255,255,255,0.2)"/>
    <text x="0" y="32" font-size="11.5" font-weight="700" fill="#94a3b8">Wilayah Kerja: Merauke · Boven Digoel · Mappi · Asmat</text>
    <text x="0" y="48" font-size="10" font-weight="500" fill="#64748b">Diterbitkan oleh Kelompok Kerja Data dan Informasi Staklim Papua Selatan</text>

    <!-- Barcode Badge Mockup -->
    <g transform="translate(370, 16)">
      <rect x="0" y="0" width="129" height="38" rx="6" fill="#ffffff" />
      <g fill="#002b49" transform="translate(10, 8)">
        <rect x="0" y="0" width="2" height="18"/>
        <rect x="4" y="0" width="4" height="18"/>
        <rect x="10" y="0" width="1" height="18"/>
        <rect x="13" y="0" width="3" height="18"/>
        <rect x="18" y="0" width="2" height="18"/>
        <rect x="22" y="0" width="5" height="18"/>
        <rect x="29" y="0" width="1" height="18"/>
        <rect x="32" y="0" width="3" height="18"/>
        <rect x="38" y="0" width="2" height="18"/>
        <rect x="42" y="0" width="4" height="18"/>
        <rect x="48" y="0" width="2" height="18"/>
        <rect x="52" y="0" width="1" height="18"/>
        <rect x="55" y="0" width="4" height="18"/>
        <rect x="61" y="0" width="2" height="18"/>
        <rect x="65" y="0" width="3" height="18"/>
        <rect x="70" y="0" width="2" height="18"/>
        <rect x="74" y="0" width="4" height="18"/>
        <rect x="80" y="0" width="1" height="18"/>
        <rect x="83" y="0" width="3" height="18"/>
        <rect x="88" y="0" width="2" height="18"/>
        <rect x="92" y="0" width="4" height="18"/>
        <rect x="98" y="0" width="2" height="18"/>
        <rect x="102" y="0" width="3" height="18"/>
      </g>
      <text x="64" y="32" font-size="7.5" font-weight="800" fill="#002b49" text-anchor="middle">ISSN 2746-8828</text>
    </g>
  </g>
</svg>
