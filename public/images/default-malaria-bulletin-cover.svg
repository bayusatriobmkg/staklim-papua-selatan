<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 595 842" width="595" height="842" style="background:#ffffff; font-family:'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="malariaBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="35%" stop-color="#064e3b"/>
      <stop offset="75%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="malariaAccentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="redAccentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="mShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="595" height="842" fill="url(#malariaBgGrad)"/>

  <!-- Wave Vector Curves (Climate & Environmental Contours) -->
  <path d="M-50 210 Q 150 140 320 230 T 650 190" fill="none" stroke="rgba(52, 211, 153, 0.22)" stroke-width="2.5" />
  <path d="M-50 260 Q 200 180 370 290 T 650 240" fill="none" stroke="rgba(45, 212, 191, 0.18)" stroke-width="2" />
  <path d="M-50 310 Q 180 230 420 340 T 650 300" fill="none" stroke="rgba(56, 189, 248, 0.14)" stroke-width="1.8" />
  <path d="M-50 360 Q 220 280 470 400 T 650 350" fill="none" stroke="rgba(52, 211, 153, 0.10)" stroke-width="1.5" />

  <!-- Abstract Vector Bars / Incidence Dots -->
  <g opacity="0.12" transform="translate(40, 520)">
    <rect x="0" y="80" width="28" height="120" rx="4" fill="#34d399"/>
    <rect x="38" y="30" width="28" height="170" rx="4" fill="#2dd4bf"/>
    <rect x="76" y="60" width="28" height="140" rx="4" fill="#38bdf8"/>
    <rect x="114" y="20" width="28" height="180" rx="4" fill="#fbbf24"/>
    <rect x="152" y="90" width="28" height="110" rx="4" fill="#f87171"/>
    <rect x="190" y="40" width="28" height="160" rx="4" fill="#34d399"/>
    <rect x="228" y="100" width="28" height="100" rx="4" fill="#2dd4bf"/>
    <rect x="266" y="50" width="28" height="150" rx="4" fill="#38bdf8"/>
  </g>

  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="595" height="10" fill="url(#redAccentGrad)"/>
  
  <!-- Institutional Header -->
  <g transform="translate(48, 50)">
    <circle cx="28" cy="28" r="26" fill="#065f46" stroke="#34d399" stroke-width="2.5"/>
    <path d="M12 28 Q 28 14 44 28" fill="none" stroke="#ffffff" stroke-width="3"/>
    <path d="M16 35 Q 28 24 40 35" fill="none" stroke="#34d399" stroke-width="2.5"/>
    <path d="M14 42 Q 28 32 42 42" fill="none" stroke="#fbbf24" stroke-width="2.5"/>
    
    <text x="70" y="22" font-size="11" font-weight="800" fill="#a7f3d0" letter-spacing="1.2">BMKG STAKLIM PAPUA SELATAN &amp; DINAS KESEHATAN</text>
    <text x="70" y="40" font-size="14.5" font-weight="900" fill="#ffffff" letter-spacing="0.5">SISTEM INFORMASI IKLIM &amp; KESEHATAN (SILING)</text>
  </g>

  <!-- Main Center Card -->
  <g transform="translate(48, 165)">
    <!-- Category Badge -->
    <rect x="0" y="0" width="235" height="28" rx="6" fill="#047857" />
    <text x="12" y="19" font-size="10.5" font-weight="800" fill="#ffffff" letter-spacing="1.2">PUBLIKASI KHUSUS IKLIM &amp; KESEHATAN</text>
    
    <!-- Big Title -->
    <text x="0" y="75" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="-0.5">BULETIN IKLIM LINGKUNGAN</text>
    <text x="0" y="115" font-size="30" font-weight="900" fill="#34d399" letter-spacing="-0.5">&amp; PERINGATAN DINI MALARIA</text>
    <text x="0" y="152" font-size="20" font-weight="800" fill="#e2e8f0" letter-spacing="0.8">PROVINSI PAPUA SELATAN</text>

    <!-- Thin Divider -->
    <rect x="0" y="176" width="499" height="3" fill="url(#malariaAccentGrad)"/>
    
    <!-- Edition & Volume Tag -->
    <g transform="translate(0, 196)">
      <rect x="0" y="0" width="225" height="36" rx="8" fill="rgba(255,255,255,0.12)" stroke="rgba(52,211,153,0.4)" stroke-width="1.5"/>
      <circle cx="18" cy="18" r="5" fill="#34d399"/>
      <text x="32" y="23" font-size="13" font-weight="800" fill="#ffffff">EDISI NOVEMBER 2026</text>
    </g>

    <!-- Key Topics / Content Table Box -->
    <g transform="translate(0, 252)">
      <rect x="0" y="0" width="499" height="235" rx="12" fill="rgba(2, 44, 34, 0.75)" stroke="rgba(52, 211, 153, 0.35)" stroke-width="1.5" />
      
      <text x="24" y="34" font-size="13.5" font-weight="800" fill="#34d399">FOKUS &amp; KONTEN UTAMA BULETIN:</text>
      
      <g transform="translate(24, 60)" font-size="12" fill="#f1f5f9" font-weight="600">
        <text x="0" y="0">✦  Analisis Korelasi Dinamika Suhu, Hujan &amp; Kelembapan Udara</text>
        <text x="0" y="28">✦  Peta Spasial Prediksi Kesesuaian Iklim Vektor Anopheles</text>
        <text x="0" y="56">✦  Evaluasi Angka Insiden (AI) Malaria di 4 Kabupaten (2021–2026)</text>
        <text x="0" y="84">✦  Peringatan Dini Potensi Lonjakan Transmisi Wilayah Berisiko</text>
        <text x="0" y="112">✦  Rekomendasi Tindak Lanjut Surveilans Vektor &amp; Pengendalian Lingkungan</text>
        <text x="0" y="140">✦  Protokol Kesiapsiagaan Fasilitas Pelayanan Kesehatan (FKTP)</text>
      </g>
    </g>
  </g>

  <!-- Bottom Region & ISSN / Publication Seal -->
  <g transform="translate(48, 735)">
    <rect x="0" y="0" width="499" height="1" fill="rgba(255,255,255,0.2)"/>
    <text x="0" y="30" font-size="11.5" font-weight="700" fill="#94a3b8">Wilayah Cakupan: Asmat · Boven Digoel · Mappi · Merauke</text>
    <text x="0" y="46" font-size="10" font-weight="500" fill="#64748b">Kolaborasi Terpadu BMKG Stasiun Klimatologi Papua Selatan &amp; Dinas Kesehatan</text>

    <!-- Barcode / Document Badge -->
    <g transform="translate(370, 14)">
      <rect x="0" y="0" width="129" height="38" rx="6" fill="#ffffff" />
      <g fill="#064e3b" transform="translate(10, 8)">
        <rect x="0" y="0" width="2" height="18"/>
        <rect x="4" y="0" width="4" height="18"/>
        <rect x="10" y="0" width="1" height="18"/>
        <rect x="13" y="0" width="3" height="18"/>
        <rect x="18" y="0" width="2" height="18"/>
        <rect x="22" y="0" width="5" height="18"/>
        <rect x="29" y="0" width="1" height="18"/>
        <rect x="32" y="0" width="3" height="18"/>
        <rect x="38" y="0" width="2" height="18"/>
        <rect x="42" y="0" width="4" height="18"/>
        <rect x="48" y="0" width="2" height="18"/>
        <rect x="52" y="0" width="1" height="18"/>
        <rect x="55" y="0" width="4" height="18"/>
        <rect x="61" y="0" width="2" height="18"/>
        <rect x="65" y="0" width="3" height="18"/>
        <rect x="70" y="0" width="2" height="18"/>
        <rect x="74" y="0" width="4" height="18"/>
        <rect x="80" y="0" width="1" height="18"/>
        <rect x="83" y="0" width="3" height="18"/>
        <rect x="88" y="0" width="2" height="18"/>
        <rect x="92" y="0" width="4" height="18"/>
        <rect x="98" y="0" width="2" height="18"/>
        <rect x="102" y="0" width="3" height="18"/>
      </g>
      <text x="64" y="32" font-size="7" font-weight="800" fill="#064e3b" text-anchor="middle">SILING-MALARIA-2026</text>
    </g>
  </g>
</svg>
