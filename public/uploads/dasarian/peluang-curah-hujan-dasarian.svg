<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720">
    <defs>
        <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#fffbeb"/>
            <stop offset="100%" stop-color="#e2e8f0"/>
        </linearGradient>
        <filter id="shadow3" x="-5%" y="-5%" width="110%" height="110%">
            <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.12"/>
        </filter>
    </defs>
    
    <rect width="1200" height="720" fill="url(#bg3)"/>
    <rect x="24" y="24" width="1152" height="672" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow3)"/>
    
    <rect x="24" y="24" width="1152" height="96" rx="16" fill="#78350f"/>
    <rect x="24" y="100" width="1152" height="20" fill="#d97706"/>
    
    <circle cx="80" cy="72" r="30" fill="#ffffff"/>
    <text x="80" y="78" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="14" font-weight="900" fill="#78350f" text-anchor="middle">BMKG</text>
    
    <text x="130" y="60" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="13" font-weight="700" fill="#fde68a" letter-spacing="1">BADAN METEOROLOGI, KLIMATOLOGI, DAN GEOFISIKA</text>
    <text x="130" y="85" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="22" font-weight="800" fill="#ffffff" letter-spacing="-0.5">PELUANG CURAH HUJAN DASARIAN II (PROBABILISTIK &gt; 50 MM)</text>
    <text x="1140" y="72" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="13" font-weight="700" fill="#facc15" text-anchor="end">PROVINSI PAPUA SELATAN</text>

    <g transform="translate(60, 140)">
        <rect x="0" y="0" width="780" height="520" rx="10" fill="#fffdf5" stroke="#fde68a" stroke-width="1.5"/>
        
        <!-- Stylized Papua Selatan Polygons with Probability Colors -->
        <!-- Asmat -->
        <path d="M 60,110 L 160,80 L 250,150 L 220,230 L 120,240 L 50,180 Z" fill="#f59e0b" stroke="#b45309" stroke-width="2.5" opacity="0.85"/>
        <text x="140" y="165" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800" fill="#78350f">KAB. ASMAT</text>
        <text x="140" y="185" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#92400e">Peluang &gt; 80%</text>
        
        <!-- Boven Digoel -->
        <path d="M 250,150 L 460,90 L 530,220 L 410,290 L 220,230 Z" fill="#b45309" stroke="#78350f" stroke-width="2.5" opacity="0.85"/>
        <text x="350" y="195" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800" fill="#ffffff">KAB. BOVEN DIGOEL</text>
        <text x="350" y="215" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#fef3c7">Peluang &gt; 90%</text>
        
        <!-- Mappi -->
        <path d="M 120,240 L 220,230 L 410,290 L 340,400 L 180,390 L 110,310 Z" fill="#fbbf24" stroke="#d97706" stroke-width="2.5" opacity="0.85"/>
        <text x="240" y="320" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800" fill="#78350f">KAB. MAPPI</text>
        <text x="240" y="340" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#92400e">Peluang 60–80%</text>
        
        <!-- Merauke -->
        <path d="M 340,400 L 410,290 L 530,220 L 680,290 L 710,480 L 480,500 L 340,400 Z" fill="#fde68a" stroke="#d97706" stroke-width="2.5" opacity="0.85"/>
        <text x="510" y="380" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="800" fill="#78350f">KAB. MERAUKE</text>
        <text x="510" y="402" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#92400e">Peluang 50–70%</text>
        
        <!-- Compass -->
        <g transform="translate(710, 40)">
            <circle cx="20" cy="20" r="18" fill="#ffffff" stroke="#78350f" stroke-width="1.5"/>
            <polygon points="20,6 25,20 15,20" fill="#ef4444"/>
            <polygon points="20,34 25,20 15,20" fill="#78350f"/>
            <text x="20" y="4" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="800" fill="#78350f" text-anchor="middle">U</text>
        </g>
    </g>
    
    <g transform="translate(865, 140)">
        <rect x="0" y="0" width="275" height="520" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
        
        <rect x="0" y="0" width="275" height="42" rx="10" fill="#d97706"/>
        <text x="137" y="27" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">PELUANG HUJAN &gt; 50 MM</text>
        
        <g transform="translate(18, 65)">
            <rect x="0" y="0" width="26" height="20" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
            <text x="38" y="15" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#0f172a">&lt; 30% (Kecil)</text>
            
            <rect x="0" y="36" width="26" height="20" rx="4" fill="#fde68a" stroke="#d97706" stroke-width="1"/>
            <text x="38" y="51" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#0f172a">30% – 50% (Sedang)</text>
            
            <rect x="0" y="72" width="26" height="20" rx="4" fill="#fbbf24" stroke="#d97706" stroke-width="1"/>
            <text x="38" y="87" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#0f172a">50% – 70% (Tinggi)</text>
            
            <rect x="0" y="108" width="26" height="20" rx="4" fill="#f59e0b" stroke="#b45309" stroke-width="1"/>
            <text x="38" y="123" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#0f172a">70% – 85% (Sangat Tinggi)</text>
            
            <rect x="0" y="144" width="26" height="20" rx="4" fill="#b45309" stroke="#78350f" stroke-width="1"/>
            <text x="38" y="159" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#0f172a">&gt; 85% (Hampir Pasti)</text>
        </g>
        
        <g transform="translate(18, 260)">
            <rect x="0" y="0" width="239" height="150" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
            <text x="12" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#78350f">ANALISIS PELUANG</text>
            <text x="12" y="46" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="500" fill="#475569">Peluang terjadinya hujan akumulasi</text>
            <text x="12" y="64" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="500" fill="#475569">&gt; 50 mm/dasarian sangat tinggi</text>
            <text x="12" y="82" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#b45309">di Boven Digoel dan Asmat.</text>
            <text x="12" y="106" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#64748b">Merauke peluang berkisar</text>
            <text x="12" y="124" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#0f172a">50% - 70%.</text>
        </g>
        
        <text x="137" y="490" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="700" fill="#64748b" text-anchor="middle">STASIUN KLIMATOLOGI PAPUA SELATAN</text>
        <text x="137" y="505" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="500" fill="#94a3b8" text-anchor="middle">Probabilistik Ensambel Multimodel BMKG</text>
    </g>
</svg>